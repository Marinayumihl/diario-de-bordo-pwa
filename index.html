<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#6d4aff">

  <title>Diário de Bordo</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>📖 Diário de Bordo</h1>
    <p>Registre os momentos e atividades do seu dia.</p>
  </header>

  <main>

    <section class="formulario">
      <h2>Nova entrada</h2>

      <form id="formEntrada">

        <label for="titulo">Título</label>
        <input
          type="text"
          id="titulo"
          placeholder="Ex: Estudei JavaScript"
          required
        >

        <label for="descricao">Descrição</label>
        <textarea
          id="descricao"
          placeholder="Conte um pouco sobre o seu dia..."
          required
        ></textarea>

        <label for="data">Data</label>
        <input
          type="date"
          id="data"
          required
        >

        <button type="submit">
          Adicionar entrada
        </button>

      </form>
    </section>

    <section class="entradas">
      <div class="titulo-entradas">
        <h2>Minhas entradas</h2>

        <button id="btnInstalar" class="btn-instalar" hidden>
          Instalar aplicativo
        </button>
      </div>

      <div id="listaEntradas">
        <!-- As entradas serão adicionadas pelo JavaScript -->
      </div>
    </section>

  </main>

  <footer>
    <p>Diário de Bordo • PWA</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
